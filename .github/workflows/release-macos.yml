name: Release (macOS)

# Runs after Windows and Linux publish so a missing Mac runner
# cannot block the GitHub release.
on:
  workflow_run:
    workflows: ["Release (Primary Platforms)"]
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: release-macos-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build (${{ matrix.artifact }})
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            artifact: macos-x64
          - os: macos-latest
            artifact: macos-arm64
    steps:
      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-meta
          path: meta
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read release tag
        id: meta
        run: |
          set -euo pipefail
          TAG="$(tr -d '\r\n' < meta/tag.txt)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.3,<7"

      - name: Ensure default .env exists
        run: |
          if [ ! -f .env ]; then
            printf '%s\n' "log_dir=_logs" "temp_dir=_temp" > .env
          fi

      - name: Build with PyInstaller
        run: python -m PyInstaller packaging/app.spec --noconfirm --clean

      - name: Stage package
        run: |
          set -euo pipefail
          STAGE="dist/stage/ImageLabeler2D-${{ matrix.artifact }}"
          mkdir -p "$STAGE"
          cp -R dist/ImageLabeler2D/. "$STAGE/"
          if [ -f .env ]; then
            cp .env "$STAGE/.env"
          fi
          cp packaging/run_mac.command "$STAGE/run_mac.command"
          chmod +x "$STAGE/run_mac.command" "$STAGE/ImageLabeler2D"
          cat > "$STAGE/README_RUN.txt" <<'EOF'
          Image Labeler 2D (macOS)
          ------------------------
          Gatekeeper often blocks unsigned PyInstaller builds downloaded from the
          internet with: "Python.framework" is damaged and can't be opened.

          Easiest: double-click run_mac.command (clears quarantine and launches).

          Or in Terminal (from this folder):
            xattr -cr .
            chmod +x ./ImageLabeler2D
            ./ImageLabeler2D

          Edit .env to change log_dir and temp_dir.
          Logs: _logs/   Temp: _temp/
          EOF

      - name: Ad-hoc codesign (macOS)
        run: |
          set -euo pipefail
          STAGE="dist/stage/ImageLabeler2D-${{ matrix.artifact }}"
          codesign --force --deep --sign - "$STAGE/ImageLabeler2D"
          FW=$(find "$STAGE" -type d -name 'Python.framework' | head -n 1 || true)
          if [ -n "$FW" ]; then
            codesign --force --deep --sign - "$FW"
          fi
          codesign --verify --deep --strict "$STAGE/ImageLabeler2D" || true

      - name: Smoke-test frozen app
        run: |
          set -euo pipefail
          STAGE="dist/stage/ImageLabeler2D-${{ matrix.artifact }}"
          export QT_QPA_PLATFORM=offscreen
          python packaging/run_smoke_test.py "$STAGE" --timeout 120
          rm -f "$STAGE/smoke_result.txt"

      - name: Compress package
        run: |
          cd dist/stage
          tar -czf "../ImageLabeler2D-${{ matrix.artifact }}.tar.gz" "ImageLabeler2D-${{ matrix.artifact }}"

      - name: Append to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: dist/ImageLabeler2D-${{ matrix.artifact }}.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
