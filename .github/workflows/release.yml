name: Release (Primary Platforms)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create/use (e.g. v0.1.0). Leave empty to use run id."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-primary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            shell: pwsh
          # Pin to 22.04 so bundled libs do not require GLIBC 2.38+
          # (ubuntu-latest is 24.04 and breaks older Ubuntu desktops).
          - os: ubuntu-22.04
            artifact: linux-x64
            shell: bash
          - os: macos-latest
            artifact: macos-arm64
            shell: bash

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Qt/OpenGL libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxi6 \
            xvfb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.3,<7"

      - name: Ensure default .env exists
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path .env)) {
            @(
              "log_dir=_logs",
              "temp_dir=_temp"
            ) | Set-Content -Encoding utf8 .env
          }

      - name: Ensure default .env exists
        if: runner.os != 'Windows'
        run: |
          if [ ! -f .env ]; then
            printf '%s\n' "log_dir=_logs" "temp_dir=_temp" > .env
          fi

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m PyInstaller packaging/app.spec --noconfirm --clean

      - name: Build with PyInstaller (Unix)
        if: runner.os != 'Windows'
        run: python -m PyInstaller packaging/app.spec --noconfirm --clean

      - name: Stage package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist/stage/ImageLabeler2D-${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "dist/ImageLabeler2D\*" -Destination $stage -Recurse -Force
          if (Test-Path .env) {
            Copy-Item .env (Join-Path $stage ".env") -Force
          }
          @(
            "Image Labeler 2D",
            "----------------",
            "1. Unzip/extract this folder.",
            "2. Run ImageLabeler2D (ImageLabeler2D.exe on Windows).",
            "3. Edit .env to change log_dir and temp_dir.",
            "Logs: _logs/   Temp: _temp/"
          ) | Set-Content -Encoding utf8 (Join-Path $stage "README_RUN.txt")

      - name: Stage package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          STAGE="dist/stage/ImageLabeler2D-${{ matrix.artifact }}"
          mkdir -p "$STAGE"
          cp -R dist/ImageLabeler2D/. "$STAGE/"
          if [ -f .env ]; then
            cp .env "$STAGE/.env"
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp packaging/run_mac.command "$STAGE/run_mac.command"
            chmod +x "$STAGE/run_mac.command" "$STAGE/ImageLabeler2D"
            cat > "$STAGE/README_RUN.txt" <<'EOF'
          Image Labeler 2D (macOS)
          ------------------------
          Gatekeeper often blocks unsigned PyInstaller builds downloaded from the
          internet with: "Python.framework" is damaged and can't be opened.

          Easiest: double-click run_mac.command (clears quarantine and launches).

          Or in Terminal (from this folder):
            xattr -cr .
            chmod +x ./ImageLabeler2D
            ./ImageLabeler2D

          Edit .env to change log_dir and temp_dir.
          Logs: _logs/   Temp: _temp/
          EOF
          else
            cat > "$STAGE/README_RUN.txt" <<'EOF'
          Image Labeler 2D (Linux)
          ------------------------
          Requires glibc from Ubuntu 22.04+ (or equivalent).

          1. Extract this folder.
          2. chmod +x ./ImageLabeler2D && ./ImageLabeler2D
          3. Edit .env to change log_dir and temp_dir.
          Logs: _logs/   Temp: _temp/

          If you see GLIBC_2.xx not found, your OS is older than the build host.
          EOF
          fi

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          STAGE="dist/stage/ImageLabeler2D-${{ matrix.artifact }}"
          codesign --force --deep --sign - "$STAGE/ImageLabeler2D"
          FW=$(find "$STAGE" -type d -name 'Python.framework' | head -n 1 || true)
          if [ -n "$FW" ]; then
            codesign --force --deep --sign - "$FW"
          fi
          codesign --verify --deep --strict "$STAGE/ImageLabeler2D" || true

      - name: Smoke-test frozen app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "dist/stage/ImageLabeler2D-${{ matrix.artifact }}"
          $env:QT_QPA_PLATFORM = "offscreen"
          python packaging/run_smoke_test.py $stage --timeout 120
          Remove-Item (Join-Path $stage "smoke_result.txt") -ErrorAction SilentlyContinue

      - name: Smoke-test frozen app (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          STAGE="dist/stage/ImageLabeler2D-${{ matrix.artifact }}"
          export QT_QPA_PLATFORM=offscreen
          XVFB_FLAG=""
          if [ "${{ runner.os }}" = "Linux" ]; then
            XVFB_FLAG="--xvfb"
          fi
          python packaging/run_smoke_test.py "$STAGE" --timeout 120 $XVFB_FLAG
          rm -f "$STAGE/smoke_result.txt"

      - name: Compress package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/stage/ImageLabeler2D-${{ matrix.artifact }}" -DestinationPath "dist/ImageLabeler2D-${{ matrix.artifact }}.zip" -Force

      - name: Compress package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist/stage
          tar -czf "../ImageLabeler2D-${{ matrix.artifact }}.tar.gz" "ImageLabeler2D-${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageLabeler2D-${{ matrix.artifact }}
          path: dist/ImageLabeler2D-${{ matrix.artifact }}.*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten assets
        run: |
          set -euo pipefail
          mkdir -p upload
          find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp -v {} upload/ \;
          ls -lah upload

      - name: Resolve tag name
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            if [ -z "$TAG" ]; then
              TAG="build-${{ github.run_number }}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"
          mkdir -p meta
          printf '%s\n' "$TAG" > meta/tag.txt
          printf '%s\n' "${{ github.sha }}" > meta/sha.txt

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: meta/
          if-no-files-found: error
          retention-days: 14

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Image Labeler 2D ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name == '' }}
          generate_release_notes: true
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
